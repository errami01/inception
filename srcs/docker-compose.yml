services:
  mariadb:
    image: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile

    container_name: mariadb

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

    # healthcheck:
    #       test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
    #       interval: 5s
    #       timeout: 5s
    #       retries: 5
  wordpress:
    image: wordpress
    build:
      context: ./requirements/wordpress

    container_name: wordpress

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - mariadb
        # condition: service_healthy

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - inception
  nginx:
    image: nginx
    build:
      context: ./requirements/nginx

    container_name: nginx

    restart: unless-stopped

    ports:
      - "443:443"

    depends_on:
      - wordpress

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - inception

volumes:
  mariadb_data:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      device: /home/aberrami/data/mariadb
      o: bind
  wordpress_data:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      device: /home/aberrami/data/wordpress
      o: bind

networks:
  inception:
    driver: bridge
